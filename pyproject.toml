[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bimarron"
version = "0.1.0"
description = "Librería de Business Intelligence orientada a la enseñanza para UABC"
readme = "README.md"
authors = [
    { name = "pako", email = "pako@uabc.edu.mx" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/pakouabc/bimarron"
